<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
  <title>單字練習</title>
</head>
<body>
  <main class="container">
    <header>
      <h1>單字練習</h1>
      <div class="controls-top">
        <div class="display-options">
          <label><input type="radio" name="displayLang" id="optLangEn" value="en" /> 英文</label>
          <label><input type="radio" name="displayLang" id="optLangZh" value="zh" /> 中文</label>
          <label><input type="radio" name="displayLang" id="optLangRand" value="rand" checked /> 隨機</label>
        </div>
      </div>
    </header>

    <section class="practice">
      <div class="status">
        <div id="roundStatus">完整學習輪：剩餘 0 題</div>
        <div id="weakStatus"></div>
      </div>

      <div class="card">
        <div class="word" id="wordBase">請選擇題庫並按「下一題」</div>
        <div class="meaning" id="wordMeaning"></div>
        <div class="forms" id="forms"></div>
        <div class="ref-image" id="refImageContainer">
          <img id="refImage" alt="參考圖片" src="" />
          <div class="ref-image-log" id="refImageLog" aria-hidden="true"></div>
        </div>
      </div>

      <div class="pools" id="poolsBox">
        <div class="pools-heading">
          <strong>題庫：</strong>
          <button id="btnTogglePools" type="button" aria-expanded="true" aria-controls="poolsList">收起題庫</button>
        </div>
        <div class="pool-list" id="poolsList">
        <strong>題庫：</strong>
        <label><input type="checkbox" id="SEL15" /> Smart English L15 <span class="pool-count" id="count-SEL15">(0)</span></label>
        <label><input type="checkbox" id="SPU8" /> Smart Phonics Unit8 <span class="pool-count" id="count-SPU8">(0)</span></label>
        <label><input type="checkbox" id="SPU7" /> Smart Phonics Unit7 <span class="pool-count" id="count-SPU7">(0)</span></label>
        </div>
      </div>

      <div class="autoplay-row">
        <label class="autoplay-toggle"><input type="checkbox" id="chkAutoplay" /> 自動播放</label>
        <label class="autoplay-interval">間隔：<input type="number" id="inputAutoplaySec" min="1" max="3600" value="10" style="width:68px;margin-left:6px;"/> 秒</label>
        <label class="autoplay-toggle"><input type="checkbox" id="chkAutoSpeak" /> 自動發音</label>
      </div>

      <div class="buttons">
        <div class="autoplay-inline" id="autoplayInline">
          <label class="autoplay-toggle"><input type="checkbox" id="chkAutoplayInline" /> 自動播放</label>
          <label class="autoplay-interval">間隔：<input type="number" id="inputAutoplaySecInline" min="1" max="3600" value="10" style="width:68px;margin-left:6px;"/> 秒</label>
          <label class="autoplay-toggle"><input type="checkbox" id="chkAutoSpeakInline" /> 自動發音</label>
        </div>
        <button id="btnSpeakBase">確認發音</button>
        <button id="btnNext">下一題</button>
        <button id="btnShowForms">顯示翻譯</button>
        <div class="weakness-controls">
          <button id="btnMarkHard">標記弱點</button>
          <button id="btnMarkEasy">已熟悉</button>
          <button id="btnResetWeak">重設弱點</button>
        </div>
      </div>

      <div id="feedback" class="feedback" aria-live="polite"></div>
    </section>

    <footer class="footer-note">
      <small>弱點資料會保存在本機裝置 (localStorage)</small>
    </footer>
  </main>

</body>
</html>
