      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="tall-shirt" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
